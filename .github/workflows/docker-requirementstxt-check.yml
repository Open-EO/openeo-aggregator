name: Docker requirements.txt lockfile check
on:
  push:
    paths:
      - 'pyproject.toml'
      - 'docker/requirements*.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'docker/requirements*.txt'
      - '.github/workflows/**'

permissions: {}

concurrency: drtc-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
      - run: |
          uv pip compile \
            --quiet \
            --python-version 3.11 --python-platform linux \
            pyproject.toml \
            -o docker/requirements.txt
      - run: git diff --exit-code docker/requirements.txt
